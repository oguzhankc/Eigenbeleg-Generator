spring.application.name=Webtech2026

# Render gibt den Port über die Umgebungsvariable PORT vor; lokal gilt 8080.
server.port=${PORT:8080}

# Adresse(n) des Frontends, die das Backend aufrufen dürfen (CORS), mehrere durch Komma getrennt.
# Auf Render wird FRONTEND_URL gesetzt; lokal ist es der Vite-Entwicklungsserver.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
