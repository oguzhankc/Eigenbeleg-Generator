spring.application.name=Webtech2026

# Render gibt den Port über die Umgebungsvariable PORT vor; lokal gilt 8080.
server.port=${PORT:8080}

# Adresse(n) des Frontends, die das Backend aufrufen dürfen (CORS), mehrere durch Komma getrennt.
# Auf Render wird FRONTEND_URL gesetzt; lokal ist es der Vite-Entwicklungsserver.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Datenbank: auf Render kommen alle drei Werte aus Umgebungsvariablen. Die Vorgaben passen nur zur
# lokalen Test-Datenbank aus docs/deployment.md und sind keine echten Zugangsdaten.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eigenbeleg}
spring.datasource.username=${DB_USERNAME:eigenbeleg}
spring.datasource.password=${DB_PASSWORD:eigenbeleg}
# Hibernate legt die Tabelle an bzw. ergänzt neue Spalten, löscht aber nie Daten
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# schema.sql (Sequenz für die Belegnummer) bei jedem Start ausführen, nicht nur bei eingebetteten Datenbanken
spring.sql.init.mode=always
